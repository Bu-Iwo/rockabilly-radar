# ROCKABILLY RADAR - Wochen-Abruf
# Liest jeden Sonntag die Quellen (vor dem Claude-Lauf um 14:43 Uhr) und legt die Ergebnisse
# im Zweig "abruf-daten" ab. Auf main wird NICHT geschrieben.
# Faellt eine Seite aus, bleibt ihr letzter guter Text erhalten und wird als "veraltet" markiert.
name: Abruf
on:
  schedule:
    - cron: '30 10 * * 0'   # Sonntag 10:30 UTC = 11:30 (Winter) bzw. 12:30 (Sommer) deutsche Zeit
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: abruf
  cancel-in-progress: false
jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Letzten Stand des Datenzweigs holen (falls vorhanden)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: abruf-daten
          path: prev
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Seiten lesen
        run: PREV=prev REPO=. node abruf/abruf.mjs out
      - name: Ergebnisse in den Zweig abruf-daten schreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r out/. /tmp/pub/
          cd /tmp/pub
          git init -q -b abruf-daten
          git config user.name "rockabilly-radar-abruf"
          git config user.email "abruf@users.noreply.github.com"
          git add -A
          git commit -q -m "Abruf $(date -u +%Y-%m-%d)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin abruf-daten
